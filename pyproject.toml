[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-annealing"
version = "0.1.0"
description = "Simulated annealing that is safe to run inside a server: deterministic, deadline-bounded, thread-safe, silent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "k3", email = "buoren@vaguely.nl" }]
keywords = [
    "simulated-annealing",
    "optimization",
    "combinatorial-optimization",
    "metaheuristic",
    "scheduling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# No runtime dependencies, on purpose: this is a loop and some arithmetic, and a
# solver that drags a numeric stack into a web image earns its place less easily.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14,<0.15", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/buoren/simple-annealing"
Issues = "https://github.com/buoren/simple-annealing/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_annealing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
